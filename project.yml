name: Dejima
options:
  bundleIdPrefix: com.nuki
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Each target includes one TranslationHub implementation: view-bound on
# macOS 15, or a directly created session on macOS 26.
targetTemplates:
  App:
    type: application
    platform: macOS
    info:
      path: Info.plist
      properties:
        CFBundleName: Dejima
        CFBundleDisplayName: Dejima
        # The release script overrides these with the tag and commit count.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Run as a menu bar app without a Dock icon.
        LSUIElement: true
    entitlements:
      path: Dejima.entitlements
      properties:
        # Global keyboard monitoring requires access outside the sandbox.
        com.apple.security.app-sandbox: false
    settings:
      base:
        # Both builds share the same app identity and preferences.
        PRODUCT_BUNDLE_IDENTIFIER: com.nuki.Dejima
        # Development defaults; release versions come from Scripts/release.sh.
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: targeted
        # Extract localizable strings and their translator comments.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        LOCALIZED_STRING_CODE_COMMENTS: YES
        ENABLE_HARDENED_RUNTIME: YES
        # Fill in your Team ID, or set signing to "Sign to Run Locally" in Xcode.
        DEVELOPMENT_TEAM: "D56G7B2W2N"
        CODE_SIGN_STYLE: Automatic

targets:
  Dejima:
    templates: [App]
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - "Translation26/**"
      # Include the catalogs explicitly because they are outside Sources.
      - path: Localizable.xcstrings
      - path: InfoPlist.xcstrings
      # Generated by Scripts/app-icon.swift.
      - path: Assets.xcassets

  Dejima26:
    templates: [App]
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        excludes:
          - "TranslationLegacy/**"
      - path: Localizable.xcstrings
      - path: InfoPlist.xcstrings
      - path: Assets.xcassets
    settings:
      base:
        # Avoid product collisions; packaging renames this to Dejima.app.
        PRODUCT_NAME: Dejima26
