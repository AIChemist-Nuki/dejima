name: Dejima
options:
  bundleIdPrefix: com.nuki
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Two builds of the same app. Everything is shared except how a
# TranslationSession is obtained, which is the one thing macOS 26 changed:
#
#   Dejima    — macOS 15+, hosts the session in a hidden 1×1 window
#   Dejima26  — macOS 26+, creates the session directly, no window
#
# Each target picks up exactly one of Sources/TranslationLegacy and
# Sources/Translation26. Both files declare `TranslationHub` with the same
# API, so nothing else in the app knows which build it is in.
targetTemplates:
  App:
    type: application
    platform: macOS
    info:
      path: Info.plist
      properties:
        CFBundleName: Dejima
        CFBundleDisplayName: Dejima
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Follows whichever deployment target the build uses.
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Menu bar only — no Dock icon, no main window.
        LSUIElement: true
    entitlements:
      path: Dejima.entitlements
      properties:
        # Accessibility monitoring and a sandbox do not get along. This is a
        # personal tool, not an App Store app.
        com.apple.security.app-sandbox: false
    settings:
      base:
        # Shared, so someone moving from the 15 build to the 26 build keeps
        # their Accessibility grant, login item and settings.
        PRODUCT_BUNDLE_IDENTIFIER: com.nuki.Dejima
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: targeted
        # Without this, nothing in Swift source reaches the String Catalog and
        # the catalog silently stays almost empty.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Puts the surrounding source comment next to each string, which is
        # most of the context a translator has to work from.
        LOCALIZED_STRING_CODE_COMMENTS: YES
        ENABLE_HARDENED_RUNTIME: YES
        # Fill in your Team ID, or set signing to "Sign to Run Locally" in Xcode.
        DEVELOPMENT_TEAM: "D56G7B2W2N"
        CODE_SIGN_STYLE: Automatic

targets:
  Dejima:
    templates: [App]
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - "Translation26/**"
      # Xcode puts these at the root. They have to be listed, or regenerating
      # the project drops the localizations.
      #
      # Regenerating does reset the project's knownRegions to English, because
      # XcodeGen has no key for it. That only affects the language list in
      # Xcode's catalog editor — the translations live inside the .xcstrings
      # files and still compile into ja.lproj and zh-Hans.lproj. To edit
      # translations after a regenerate, re-add the languages in Xcode.
      - path: Localizable.xcstrings
      - path: InfoPlist.xcstrings
      # Drawn by Scripts/app-icon.swift, not by hand.
      - path: Assets.xcassets

  Dejima26:
    templates: [App]
    deploymentTarget: "26.0"
    sources:
      - path: Sources
        excludes:
          - "TranslationLegacy/**"
      - path: Localizable.xcstrings
      - path: InfoPlist.xcstrings
      - path: Assets.xcassets
    settings:
      base:
        # Distinct so both can build into the same directory without
        # overwriting each other. Rename the .app when packaging a release.
        PRODUCT_NAME: Dejima26
